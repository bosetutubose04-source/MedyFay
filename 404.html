<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MedyFay - Medicine Delivery</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // Detects project repository subpaths (e.g. username.github.io/repo-name/)
      var pathSegmentsToKeep = (window.location.hostname.indexOf('github.io') !== -1 && window.location.pathname.split('/').filter(Boolean).length > 0) ? 1 : 0; 
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
